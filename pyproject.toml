[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-protocol-kit"
version = "1.0.0"
description = "Phase 0 protocol.json schema, canonical serializer, and validation CLI for the Nexus Scholar harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
scholar-protocol = "scholar_protocol.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_protocol"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
